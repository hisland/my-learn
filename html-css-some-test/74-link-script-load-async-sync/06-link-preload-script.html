<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>06 link preload + script</title>
  <script src="js/log-helper.js"></script>
  <link rel="preload" href="js/b.js" as="script" id="preload-b" />
  <script>
    logScript('after-preload-tag', 'parse', 'preload 不执行脚本，只提前下载');
    document.getElementById('preload-b').addEventListener('load', function () {
      logScript('preload-b.js', 'load', 'rel=preload 完成');
    });
  </script>
  <script src="js/a.js"></script>
  <script src="js/b.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; }
    #log { background: #fafafa; border: 1px solid #ddd; padding: 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>06 — &lt;link rel="preload" as="script"&gt;</h1>
  <pre>
• preload：高优先级提前 fetch，不执行
• 后面普通 &lt;script src="b.js"&gt; 可能命中缓存，更快执行
• 对比 Network：b.js 是否出现两次请求（通常第二次 from disk/memory cache）
  </pre>
  <div id="log"></div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      renderLog('06 preload + script');
    });
  </script>
</body>
</html>
